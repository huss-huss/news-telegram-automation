name: CI

on:
  push:
    branches: [main, upgrade-2026]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: JSON lint
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n1 sh -c 'python -m json.tool "$0" > /dev/null || { echo "invalid JSON: $0"; exit 1; }'
      - name: Validate n8n workflows
        run: python tools/validate_workflows.py workflows --env-example .env.example
      - name: Run pytest
        run: pytest

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
